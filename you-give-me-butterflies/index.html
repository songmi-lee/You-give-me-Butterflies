<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>You give me Butterflies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        padding: 0; margin: 0;
        background: #0f1c18; color: #e8efe9;
        overflow: hidden; overscroll-behavior: none; touch-action: none;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        font-family: "Noto Sans KR", sans-serif;
      }
      canvas { display: block; }
      .overlay {
        position: fixed; inset: 0; display: none;
        align-items: center; justify-content: center;
        background: rgba(8, 16, 13, 0.72); z-index: 10; padding: 20px;
      }
      .overlay.show { display: flex; }
      .card {
        width: min(360px, 100%); background: #17271f; border: 1px solid #2c4339;
        border-radius: 18px; padding: 24px 20px; text-align: center;
      }
      .card h1, .card h2 { font-family: "Gowun Dodum", sans-serif; font-weight: 400; margin: 0 0 6px; }
      .card h1 { font-size: 26px; }
      .card h2 { font-size: 21px; }
      .card p { margin: 0 0 18px; color: #9db0a8; font-size: 14px; }
      input {
        width: 100%; box-sizing: border-box; font: inherit; font-size: 17px;
        padding: 12px 14px; border-radius: 12px; border: 1px solid #3a5649;
        background: #0f1c18; color: #fff; margin-bottom: 12px; text-align: center;
      }
      button {
        font: inherit; font-size: 16px; cursor: pointer; touch-action: manipulation;
        border-radius: 12px; border: 1px solid #3a5649; background: transparent; color: #e8efe9;
        min-height: 46px; padding: 0 16px;
      }
      button.main { background: #f2b5cf; color: #2a1220; border-color: #f2b5cf; width: 100%; font-weight: 500; }
      button:disabled { opacity: 0.4; cursor: default; }
      #pickList { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; max-height: 50vh; overflow-y: auto; }
      #pickList button { display: flex; justify-content: space-between; align-items: center; width: 100%; }
      #pickList small { color: #9db0a8; font-size: 12px; }
      .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
      #mail {
        position: fixed; right: 20px; bottom: 24px; z-index: 5; display: none;
        width: 64px; height: 64px; border-radius: 50%; padding: 0;
        background: #f2b5cf; border: 0; align-items: center; justify-content: center;
      }
      #mail svg { width: 30px; height: 30px; }
      #back {
        position: fixed; left: 14px; top: 14px; z-index: 5; display: none;
        background: rgba(0, 0, 0, 0.45); border: 0; width: 46px; padding: 0; font-size: 22px;
      }
      #toast {
        position: fixed; left: 50%; top: 22px; transform: translateX(-50%); z-index: 20;
        background: #fff; color: #14231e; padding: 9px 18px; border-radius: 22px; font-size: 14px;
        display: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/p5@2/lib/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="sketch.js"></script>
  </head>

  <body>
    <main></main>

    <!-- 처음 들어올 때: 이름 쓰기 -->
    <div class="overlay" id="join">
      <div class="card">
        <h1>You give me Butterflies</h1>
        <p>친구들이 알아볼 수 있는 이름을 써주세요.<br />카메라와 마이크를 사용해요.</p>
        <input id="nameInput" maxlength="10" placeholder="이름" autocomplete="off" />
        <button class="main" id="joinBtn">꽃밭으로 들어가기</button>
      </div>
    </div>

    <!-- 누구에게 보낼까요? -->
    <div class="overlay" id="picker">
      <div class="card">
        <h2>누구에게 보낼까요?</h2>
        <p>그 친구를 떠올리며 골라주세요.</p>
        <div id="pickList"></div>
        <button id="pickCancel">닫기</button>
      </div>
    </div>

    <button id="mail" aria-label="나비 보내기">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2a1220" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2.5" />
        <path d="M3.5 6.5 12 13l8.5-6.5" />
      </svg>
    </button>
    <button id="back" aria-label="꽃밭으로 돌아가기">×</button>
    <div id="toast"></div>
  </body>
</html>
